name: Methods issue
description: Report a defect or propose an improvement with synthetic inputs.
body:
  - type: markdown
    attributes:
      value: Use invented inputs only. Do not upload real map, personnel or operational data. For suspected exposure, follow SECURITY.md.
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and observed behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal synthetic reproduction and runtime versions
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Proposed change or known limits
